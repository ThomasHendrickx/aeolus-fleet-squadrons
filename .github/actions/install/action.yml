# Installs the dependencies from an Actions cache entry keyed on the runner OS,
# the Node version and the hash of package-lock.json, and runs npm ci only on a
# miss. The entry holds every workspace's node_modules. The Prisma client is not
# cached: the schema is not in the key, so every hit generates it again. Needs
# the repository checked out and Node set up.
name: Install
description: Restores node_modules from the Actions cache, running npm ci on a miss.
runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: install-${{ runner.os }}-node-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    # npm ci generates the client in its postinstall; a hit runs the same step.
    - if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: npm run generate --workspace @aeolus-fleet/squadrons
